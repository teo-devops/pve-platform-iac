# CATALOGO CERRADO DE TAMAÑOS. Unica fuente: Terraform lo lee con yamldecode, el
# asistente (`make new-vm` / `make new-cluster`) solo ofrece lo que hay aqui y la
# tabla de docs/peticiones.md la genera `make docs` (el CI comprueba que esta al dia).
#
# Cerrado a proposito: la capacidad del homelab es la suma de estos numeros. Lo
# cambia el admin, por PR, y afecta a TODAS las VMs del flavor en el siguiente
# apply (Terraform redimensiona cores/RAM; el disco solo crece).
#
#   memory en MB, disk en GB.

flavors:
  # --- VMs sueltas ---------------------------------------------------------
  vm-small:
    cores: 2
    memory: 4096
    disk: 40
    description: VM independiente por defecto
  vm-medium:
    cores: 4
    memory: 8192
    disk: 80
    description: VM para servicios medianos (p. ej. monitorizacion)
  vm-large:
    cores: 8
    memory: 16384
    disk: 160
    description: VM para servicios pesados

  # --- Dataspace MVP sobre kind (una VM, el MVP entero dentro) ---------------
  # El MVP `demo` de dataspace-mvp pide ~7.2 GiB en kind con observabilidad
  # (Elasticsearch + Kibana + Jaeger); con menos de 16 GB, Elasticsearch es lo
  # primero que mata el OOM. Las imagenes se precargan: hace falta disco.
  ds-mvp-kind:
    cores: 8
    memory: 16384
    disk: 120
    description: "Dataspace: MVP completo en kind, con observabilidad"
  ds-mvp-kind-lite:
    cores: 4
    memory: 12288
    disk: 80
    description: "Dataspace: MVP en kind sin observabilidad (observability.components vacio en mvp.yaml)"

  # --- Nodos de clusters k3s (se piden por familia, ver cluster_sizes) -------
  k3s-mini-master:
    cores: 2
    memory: 4096
    disk: 40
    description: Master de cluster k3s pequeño
  k3s-mini-worker:
    cores: 4
    memory: 8192
    disk: 80
    description: Worker de cluster k3s pequeño

# FAMILIAS DE CLUSTER k3s. Un cluster = 1 master `<familia>-master` + N workers
# `<familia>-worker`. min_workers es un suelo que validan el asistente, `make check`
# y el propio `terraform plan`. k3s_version: la que instala Ansible.
cluster_sizes:
  k3s-mini:
    min_workers: 1
    default_workers: 2
    k3s_version: v1.33.5+k3s1
    description: Cluster k3s pequeño de pruebas
