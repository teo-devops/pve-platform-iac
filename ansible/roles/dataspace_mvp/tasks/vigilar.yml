---
# Una vuelta de la vigilancia del despliegue. Al final se incluye a si mismo para
# la siguiente, mientras no haya terminado, fallado o agotado mvp_timeout.
# Deja mvp_fin a "ok" / "fallo" / "sigue" (si es "sigue" al final: se acabo el tiempo).

- name: Esperar {{ mvp_poll }}s
  ansible.builtin.wait_for:
    timeout: "{{ mvp_poll }}"
  delegate_to: localhost
  become: false
  when: mvp_vuelta | int > 0

- name: ¿Ha terminado el script?
  become: true
  become_user: "{{ mvp_user }}"
  ansible.builtin.async_status:
    jid: "{{ mvp_deploy.ansible_job_id }}"
  register: mvp_job
  failed_when: false

- name: Estado del despliegue
  become: true
  become_user: "{{ mvp_user }}"
  ansible.builtin.command: python3 {{ mvp_estado_bin }} --log {{ mvp_dir }}/despliegue.log --context kind-{{ mvp_kind_cluster }}
  environment:
    HOME: "/home/{{ mvp_user }}"
  register: mvp_estado_raw
  changed_when: false
  failed_when: false

- name: Interpretar el estado
  vars:
    e: "{{ mvp_estado_raw.stdout | from_json if mvp_estado_raw.rc == 0 else {'fase': '(no se pudo leer el estado)', 'errores_log': [], 'cluster': false} }}"
  ansible.builtin.set_fact:
    mvp_e: "{{ e }}"
    # Cuantas vueltas seguidas lleva cada pod en un estado "persistente" (los que
    # salen de ese estado se olvidan).
    mvp_strikes: >-
      {% set s = {} %}{% for r in (e.rotos | default([])) if not r.instantaneo %}{% set _ = s.update({r.pod: (mvp_strikes | default({})).get(r.pod, 0) | int + 1}) %}{% endfor %}{{ s }}

- name: Calcular si hay que parar
  vars:
    terminado: "{{ (mvp_job.finished | default(0) | int) == 1 }}"
    rc: "{{ mvp_job.rc | default(0) | int }}"
    instantaneos: "{{ mvp_e.rotos | default([]) | selectattr('instantaneo') | list }}"
    persistentes: "{{ mvp_e.rotos | default([]) | rejectattr('instantaneo')
                      | selectattr('pod', 'in', mvp_strikes | dict2items | selectattr('value', '>=', mvp_fail_after | int)
                                                 | map(attribute='key') | list) | list }}"
  ansible.builtin.set_fact:
    mvp_motivo: >-
      {%- if mvp_e.errores_log | default([]) -%}el log del despliegue tiene errores: {{ mvp_e.errores_log[:3] | join(' | ') }}
      {%- elif instantaneos -%}pods que no van a arrancar solos: {{ instantaneos | map(attribute='pod') | map('regex_replace', '^[^/]+/', '') | join(', ') }} ({{ instantaneos | map(attribute='motivo') | unique | join(', ') }})
      {%- elif persistentes -%}pods atascados {{ mvp_fail_after | int * mvp_poll | int // 60 }}+ min: {{ persistentes | map(attribute='pod') | map('regex_replace', '^[^/]+/', '') | join(', ') }} ({{ persistentes | map(attribute='motivo') | unique | join(', ') }})
      {%- elif terminado and rc != 0 -%}el script ha terminado con codigo {{ rc }}
      {%- endif -%}
    # Valores explicitos y no "": en Ansible 2.20 una plantilla que da cadena
    # vacia se convierte en None.
    mvp_fin: >-
      {{ 'fallo' if ((mvp_e.errores_log | default([])) or instantaneos or persistentes or (terminado and rc != 0))
         else ('ok' if (terminado and mvp_e.todo_listo | default(false)) else 'sigue') }}
    mvp_script_terminado: "{{ terminado }}"

- name: Progreso
  ansible.builtin.debug:
    msg: >-
      [{{ '%02d:%02d' | format((mvp_vuelta | int * mvp_poll | int) // 60, (mvp_vuelta | int * mvp_poll | int) % 60) }}]
      {{ 'script terminado' if mvp_script_terminado | bool else mvp_e.fase }}
      {%- if mvp_e.cluster | default(false) %} | pods listos {{ mvp_e.listos }}/{{ mvp_e.total }}
      {%- if mvp_e.rotos | default([]) %}, con problemas {{ mvp_e.rotos | length }}{% endif %}{% endif %}

# La condicion de un include_tasks la heredan TODAS las tareas incluidas (y se
# reevalua en cada una). Por eso se decide aqui, al final, con un dato que solo
# cambia aqui: si dependiera de mvp_fin, la vuelta en la que termina se
# saltaria su propia linea de progreso.
- name: Decidir si hay otra vuelta
  ansible.builtin.set_fact:
    mvp_seguir: "{{ mvp_fin == 'sigue' and (mvp_vuelta | int + 1) * (mvp_poll | int) <= (mvp_timeout | int) }}"
    mvp_vuelta: "{{ mvp_vuelta | int + 1 }}"

- name: Vigilar otra vuelta
  ansible.builtin.include_tasks: vigilar.yml
  when: mvp_seguir | bool
