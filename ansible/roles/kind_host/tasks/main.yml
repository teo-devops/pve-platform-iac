---
# Maquina lista para `kind create cluster`: Docker (dependencia), kind, kubectl,
# helm y las herramientas que usan los scripts del MVP de dataspace.

# Docker 29 guarda las imagenes por defecto en el almacen de containerd, y con el
# `kind load docker-image` falla con imagenes multiplataforma ("ctr: content
# digest ... not found"): los pods acaban en ErrImageNeverPull (visto
# el 13-oct-2026, Docker 29.9 + kind v0.30). Con el almacen clasico funciona.
# Al cambiarlo, Docker deja de ver los contenedores creados con el otro: el
# cluster kind que hubiera "desaparece" y el rol dataspace_mvp lo recrea.
- name: Docker con el almacen de imagenes clasico (lo necesita kind load)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'features': {'containerd-snapshotter': false}} | to_nice_json }}\n"
    mode: "0644"
  register: kind_host_daemon_json

- name: Reiniciar Docker para aplicar el almacen
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: kind_host_daemon_json.changed

- name: Instalar herramientas que usan los scripts del MVP
  ansible.builtin.apt:
    name: [git, jq, curl, python3, python3-yaml, make]
    state: present

- name: Subir limites de inotify para KinD
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kind.conf
    reload: true
  loop: "{{ kind_host_sysctl | dict2items }}"

- name: Crear directorio de binarios versionados
  ansible.builtin.file:
    path: "{{ kind_host_bin_dir }}"
    state: directory
    mode: "0755"

# Un fichero por version y un symlink: cambiar la version en defaults descarga la
# nueva y mueve el enlace; repetir el play con la misma no descarga nada.
- name: Descargar kind y kubectl
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ kind_host_bin_dir }}/{{ item.name }}-{{ item.version }}"
    mode: "0755"
  loop:
    - name: kind
      version: "{{ kind_version }}"
      url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-{{ kind_host_arch }}"
    - name: kubectl
      version: "{{ kubectl_version }}"
      url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kind_host_arch }}/kubectl"

- name: Descomprimir helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ kind_host_arch }}.tar.gz"
    dest: "{{ kind_host_bin_dir }}"
    remote_src: true
    creates: "{{ kind_host_bin_dir }}/helm-{{ helm_version }}"
    extra_opts: ["--transform", "s|linux-{{ kind_host_arch }}/helm|helm-{{ helm_version }}|", "--wildcards", "*/helm"]

- name: Enlazar los binarios en el PATH
  ansible.builtin.file:
    src: "{{ kind_host_bin_dir }}/{{ item.name }}-{{ item.version }}"
    dest: "/usr/local/bin/{{ item.name }}"
    state: link
    force: true
  loop:
    - {name: kind, version: "{{ kind_version }}"}
    - {name: kubectl, version: "{{ kubectl_version }}"}
    - {name: helm, version: "{{ helm_version }}"}
