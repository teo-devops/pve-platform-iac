# ansible.cfg — en CI se fuerza con ANSIBLE_CONFIG (el runner deja el checkout con
# permisos de escritura para todos, y Ansible ignora un ansible.cfg en un
# directorio asi).
[defaults]
inventory       = inventory/hosts.ini
# Los roles estan en ansible/roles, no en playbooks/roles. Ruta relativa a este
# fichero: los playbooks se ejecutan desde ansible/.
roles_path      = roles
remote_user     = ops
retry_files_enabled = False
# La vigilancia del despliegue del MVP es un bucle: sin esto, cada vuelta que
# sobra al terminar sale como "skipping".
display_skipped_hosts = False
interpreter_python = auto_silent

# Claves de host SIEMPRE verificadas (docs/seguridad.md, R-04). Nunca False: una
# clave distinta de la esperada es justo lo que hay que ver (VM suplantada o
# recreada sin pasar por el pipeline).
host_key_checking = True

[ssh_connection]
# Solo se aceptan las claves de host publicadas por el pipeline (known_hosts de la
# raiz del repo, que genera `iac known-hosts --scan` dentro de la red al crear la
# VM), nunca las de ~/.ssh/known_hosts ni una nueva sin preguntar.
# `scripts/iac configure` pone la ruta absoluta en ANSIBLE_SSH_ARGS; este valor es
# el de reserva si se llama a ansible-playbook a mano desde ansible/.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=../known_hosts

[privilege_escalation]
become = True
become_method = sudo
