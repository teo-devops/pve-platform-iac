# drift.yml — deteccion diaria de deriva: ¿coincide Proxmox con main?
#
# `terraform plan -detailed-exitcode` refrescando el estado contra Proxmox:
#   0 -> sin cambios: todo bien.
#   2 -> DERIVA: alguien ha tocado Proxmox fuera de Git (una VM cambiada o borrada
#        en la UI, un disco redimensionado...). El job FALLA (GitHub avisa por correo
#        a quien vigile el repo) y abre o actualiza un issue `drift` con el resumen.
#   1 -> error del plan: el job falla igual, sin issue.
#
# NO CORRIGE NADA. Decide el admin: revertir el cambio manual o llevarlo a Git
# (docs/runbooks/deriva-detectada.md). -lock=false: solo lee.
#
# Mismo runner y secretos que deploy (homelab-apply, environment production):
# refrescar una VM exige VM.Config.Disk, que el token de plan no tiene.
name: drift

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC cada dia (minuto raro: evita la hora punta de GitHub)
  workflow_dispatch:

permissions:
  contents: read

# Grupo propio, no el de deploy: en GitHub un run pendiente nuevo CANCELA al
# pendiente anterior del mismo grupo, y un drift podria cancelar un deploy en cola.
# Leer el estado mientras se aplica es inofensivo (-lock=false); como mucho, un
# falso positivo que el siguiente drift aclara.
concurrency:
  group: drift
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  NO_COLOR: "1"
  TF_IN_AUTOMATION: "1"
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}

jobs:
  drift:
    runs-on: [self-hosted, homelab-apply]
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_pm_api_token: ${{ secrets.PM_APPLY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan de deriva
        id: drift
        run: |
          SSL_CERT_FILE="$(./scripts/ca-bundle.sh)"; export SSL_CERT_FILE
          terraform -chdir=terraform init -input=false -lockfile=readonly
          set +e
          terraform -chdir=terraform plan -input=false -lock=false -detailed-exitcode -out=drift.tfplan
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 2 ]; then
            ./scripts/iac plan-summary --plan drift.tfplan --markdown > drift.md
            cat drift.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" = 0 ]; then
            echo "✓ Sin deriva: Proxmox coincide con main." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f terraform/drift.tfplan

      - name: Abrir o actualizar el issue de deriva
        if: steps.drift.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "La comprobacion diaria ha encontrado cambios en Proxmox que no vienen de \`main\`."
            echo "Nada se ha corregido automaticamente. Runbook: \`docs/runbooks/deriva-detectada.md\`."
            echo
            cat drift.md
            echo
            echo "_Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($(date -u +%F))_"
          } > body.md
          gh label create drift --color B60205 --description "Proxmox no coincide con main" 2>/dev/null || true
          n=$(gh issue list --label drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file body.md
          else gh issue create --title "Deriva: Proxmox no coincide con main" --label drift --body-file body.md; fi

      - name: Resultado
        run: |
          case "${{ steps.drift.outputs.rc }}" in
            0) echo "Sin deriva." ;;
            2) echo "::error::DERIVA: Proxmox no coincide con main (resumen arriba e issue 'drift')."; exit 1 ;;
            *) echo "::error::El plan de deriva ha fallado (codigo ${{ steps.drift.outputs.rc }})."; exit 1 ;;
          esac
