# pr-validate.yml — validaciones SIN credenciales de cada PR (y de main).
#
# Corre en runners HOSPEDADOS por GitHub (ubuntu-latest), nunca en los del homelab:
# aqui se ejecuta el codigo del PR tal cual, y un PR puede venir de cualquier
# colaborador. Sin secretos, sin red al homelab: lo peor que puede hacer un PR
# malicioso es fallar su propio check (docs/seguridad.md, R-01).
#
# Estos jobs son los "checks obligatorios" del ruleset de main (docs/bootstrap.md §4).
name: pr-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.5
  NO_COLOR: "1"

jobs:
  peticiones:
    name: peticiones y catalogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.3 check-jsonschema==0.38.2 yamllint==1.38.0
      - name: yamllint
        run: yamllint -c .yamllint.yaml .
      - name: estructura de las peticiones (schema/)
        run: |
          shopt -s nullglob
          vms=(requests/vms/*.yaml); cl=(requests/clusters/*.yaml)
          [ ${#vms[@]} -eq 0 ] || check-jsonschema --schemafile schema/vm.schema.json "${vms[@]}"
          [ ${#cl[@]} -eq 0 ] || check-jsonschema --schemafile schema/cluster.schema.json "${cl[@]}"
      - name: reglas (rangos, duplicados, perfiles, mvp) — scripts/iac check
        run: ./scripts/iac check
      - name: docs al dia con el catalogo y sin enlaces rotos
        run: |
          ./scripts/iac flavors --check-docs
          ./scripts/check-docs-links.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff
      # -backend=false: sin estado ni credenciales; valida sintaxis, tipos y que el
      # provider instalado es el del lockfile.
      - name: validate
        run: |
          terraform -chdir=terraform init -input=false -backend=false -lockfile=readonly
          terraform -chdir=terraform validate
      - name: tflint
        run: docker run --rm -v "$PWD:/data" -w /data/terraform ghcr.io/terraform-linters/tflint:v0.64.0 --recursive --config /data/terraform/.tflint.hcl

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet ansible-core==2.21.4 ansible-lint==26.9.0
      - name: colecciones
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml
      - name: syntax-check
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        run: |
          # Inventario vacio pero con los grupos que usan los playbooks.
          printf '[proxmox_vms]\n[k3s_server]\n[k3s_agent]\n[monitoring]\n[dataspace_kind]\n' > inventory/hosts.ini
          for p in playbooks/*.yml; do ansible-playbook "$p" --syntax-check; done
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --offline playbooks/ roles/
      - name: shellcheck y python
        run: |
          shellcheck -S warning scripts/*.sh ansible/inventory/generate_inventory.sh runner/*.sh
          python3 -m py_compile scripts/iac scripts/check-docs-links.py ansible/roles/dataspace_mvp/files/estado_mvp.py

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      # Defensa en profundidad: toda action de terceros fijada por SHA completo.
      - name: actions fijadas por SHA
        run: |
          if grep -rnE '^\s*-?\s*uses:\s*[^ #]+@' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::Hay actions sin fijar por SHA (arriba). Usa el SHA completo y la version en un comentario."
            exit 1
          fi
